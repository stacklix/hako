services:
  server:
    build: .
    restart: unless-stopped
    environment:
      HAKO_PUBLIC_URL: ${HAKO_PUBLIC_URL:?Set HAKO_PUBLIC_URL to the public HTTPS origin}
      HAKO_DATA_DIR: /app/data
      HAKO_CONFIG_FILE: /app/config/server.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    stop_grace_period: 15s
