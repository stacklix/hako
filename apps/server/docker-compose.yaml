services:
  server:
    image: ghcr.io/stacklix/hako-server:latest
    container_name: hako-server
    restart: unless-stopped
    environment:
      HAKO_PUBLIC_URL: ${HAKO_PUBLIC_URL:?Set HAKO_PUBLIC_URL to the public HTTPS origin}
      HAKO_DATA_DIR: /app/data
      HAKO_CONFIG_FILE: /app/config/server.json
      HAKO_TRUSTED_PROXIES: ${HAKO_TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      # Optional: enable accessLogs.directory=/app/caddy-logs in server.json.
      # Ensure UID 10001 can read the host log directory and files.
      # - /var/log/caddy:/app/caddy-logs:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    stop_grace_period: 15s
