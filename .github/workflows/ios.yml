name: Build and install Hako
on:
  push:
    paths:
      - 'apps/ios/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      - name: Validate packaging scripts
        run: |
          bash -n scripts/ci-archive.sh
          python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Typecheck Console client without signing
        run: |
          swiftc -target arm64-apple-macos14.0 -typecheck Hako/Models.swift Hako/Server/ConsoleSecurity.swift Hako/Server/ConsoleWebLoginProtocol.swift Hako/DeviceManagement/ConsoleAgentRegistration.swift Hako/DeviceManagement/ConsoleAgentProtocol.swift Hako/Server/ConsoleSessionRestoration.swift Hako/Server/ConsoleClient.swift
          swiftc Hako/Server/ConsoleSessionRestoration.swift Tests/ConsoleSessionRestorationTests.swift -o /tmp/hako-session-restoration-tests
          /tmp/hako-session-restoration-tests
          swiftc Hako/DeviceManagement/ConsoleAgentProtocol.swift Tests/ConsoleAgentProtocolTests.swift -o /tmp/hako-agent-protocol-tests
          /tmp/hako-agent-protocol-tests
          swiftc Hako/DeviceManagement/ConsoleAgentRegistration.swift Tests/ConsoleAgentRegistrationTests.swift -o /tmp/hako-agent-registration-tests
          /tmp/hako-agent-registration-tests
          swiftc Hako/Server/ConsoleWebLoginProtocol.swift Tests/ConsoleWebLoginTests.swift -o /tmp/hako-web-login-tests
          /tmp/hako-web-login-tests
          swiftc -target arm64-apple-macos14.0 Hako/Models.swift Hako/Server/ConsoleSecurity.swift Tests/ConsoleIdentityTests.swift -o /tmp/hako-identity-tests
          /tmp/hako-identity-tests
      - name: Test usage storage and GitHub merge
        run: |
          swiftc -target arm64-apple-macos14.0 Hako/Models.swift Hako/CSV.swift Tests/CoreTests.swift -o /tmp/hako-core-tests
          /tmp/hako-core-tests
          swiftc -target arm64-apple-macos14.0 Hako/Models.swift Hako/CSV.swift Hako/GitHub.swift Hako/UsageSync.swift Hako/BuildStatus.swift Tests/GitHubTests.swift -o /tmp/hako-github-tests
          /tmp/hako-github-tests
      - name: Test device card ordering, layout and scroll restoration
        run: |
          swiftc Hako/DeviceManagement/DeviceCardPresentation.swift Tests/DeviceCardPresentationTests.swift -o /tmp/hako-device-card-tests
          /tmp/hako-device-card-tests
      - name: Test Arcane client protocols and networking
        run: |
          swiftc -target arm64-apple-macos14.0 -typecheck Hako/Containers/ArcaneProtocol.swift Hako/Containers/ArcaneWorkspaceProtocol.swift Hako/Containers/ArcaneHostProtocol.swift Hako/Containers/ArcaneClient.swift Hako/Containers/ArcaneKeychain.swift Hako/Containers/ArcaneStore.swift Hako/Containers/ArcaneFilesStore.swift
          swiftc Hako/Containers/ArcaneProtocol.swift Hako/Containers/ArcaneWorkspaceProtocol.swift Hako/Containers/ArcaneHostProtocol.swift Hako/Containers/ArcaneClient.swift Tests/ArcaneTests.swift -o /tmp/hako-arcane-tests
          /tmp/hako-arcane-tests
          swiftc -target arm64-apple-macos14.0 Hako/Containers/ArcaneProtocol.swift Hako/Containers/ArcaneWorkspaceProtocol.swift Hako/Containers/ArcaneHostProtocol.swift Hako/Containers/ArcaneClient.swift Hako/Containers/ArcaneKeychain.swift Hako/Containers/ArcaneStore.swift Hako/Containers/ArcaneFilesStore.swift Tests/ArcaneLoadingTests.swift -o /tmp/hako-arcane-loading-tests
          /tmp/hako-arcane-loading-tests
          swiftc Hako/Containers/ArcaneProtocol.swift Hako/Containers/ArcaneWorkspaceProtocol.swift Hako/Containers/ArcaneHostProtocol.swift Hako/Containers/ArcaneClient.swift Tests/ArcaneWorkspaceTests.swift -o /tmp/hako-arcane-workspace-tests
          /tmp/hako-arcane-workspace-tests
          swiftc Hako/Containers/ArcaneSyntax.swift Tests/ArcaneSyntaxTests.swift -o /tmp/hako-arcane-syntax-tests
          /tmp/hako-arcane-syntax-tests
          swiftc Hako/Containers/ArcaneEditorLines.swift Tests/ArcaneEditorLinesTests.swift -o /tmp/hako-arcane-editor-lines-tests
          /tmp/hako-arcane-editor-lines-tests
          swiftc -target arm64-apple-macos14.0 Hako/Containers/ArcaneProtocol.swift Hako/Containers/ArcaneWorkspaceProtocol.swift Hako/Containers/ArcaneHostProtocol.swift Hako/Containers/ArcaneClient.swift Hako/Containers/ArcaneHostData.swift Tests/ArcaneHostTests.swift -o /tmp/hako-arcane-host-tests
          /tmp/hako-arcane-host-tests
          swiftc Hako/Containers/ArcaneProtocol.swift Hako/Containers/ArcaneWorkspaceProtocol.swift Hako/Containers/ArcaneHostProtocol.swift Hako/Containers/ArcaneClient.swift Hako/Containers/ArcaneCommandProtocol.swift Hako/Containers/ArcaneTerminalTransport.swift Tests/ArcaneCommandTests.swift -o /tmp/hako-arcane-command-tests
          /tmp/hako-arcane-command-tests
          swiftc -target arm64-apple-macos14.0 Hako/Containers/ArcaneProtocol.swift Hako/Containers/ArcaneWorkspaceProtocol.swift Hako/Containers/ArcaneHostProtocol.swift Hako/Containers/ArcaneClient.swift Hako/Containers/ArcaneKeychain.swift Hako/Containers/ArcaneStore.swift Hako/Containers/ArcaneFilesStore.swift Hako/Containers/ArcaneCommandProtocol.swift Hako/Containers/ArcaneTerminalTransport.swift Hako/Containers/ArcaneCommandsData.swift Tests/ArcaneCommandDataTests.swift -o /tmp/hako-arcane-command-data-tests
          /tmp/hako-arcane-command-data-tests
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Archive and export signed IPA
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/ci-archive.sh
      - name: Create installation page
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build-install-page.py --ipa ../../dist/ios/Hako.ipa --url "$PAGES_URL" --output ../../dist/ios/site
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Hako-IPA-${{ github.run_number }}
          path: dist/ios/*.ipa
          retention-days: 14
      - name: Upload installation page
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/ios/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy installation page
        id: deployment
        uses: actions/deploy-pages@v5
