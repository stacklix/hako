name: Hako iOS
on:
  push:
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test Linux ECS snapshots and installation page
        run: python3 -m unittest discover -s apps/ios/Tests -p 'test_*.py'
  test:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      - name: Validate packaging scripts
        run: |
          bash -n scripts/ci-archive.sh
          python3 -m unittest discover -s Tests -p 'test_*.py'
          swiftc Hako/App/Updates/AppUpdateRelease.swift Tests/AppUpdateReleaseTests.swift -o /tmp/hako-app-update-tests
          /tmp/hako-app-update-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Shared/HakoServer/HakoServerCompatibility.swift Tests/HakoServerCompatibilityTests.swift -o /tmp/hako-server-compatibility-tests
          /tmp/hako-server-compatibility-tests
      - name: Test investment assistant proposals and model protocols
        run: |
          swiftc Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Shared/Infrastructure/LanguageModel.swift Hako/Features/Investment/InvestmentBook.swift Hako/Features/Investment/InvestmentBalanceBook.swift Hako/Features/Investment/InvestmentSnapshots.swift Hako/Features/Investment/InvestmentServerRecords.swift Hako/Features/Investment/InvestmentAgentActions.swift Hako/Features/Investment/InvestmentAgentProposal.swift Hako/Features/Investment/InvestmentAgentHTML.swift Hako/Features/Investment/InvestmentAgentConversation.swift Tests/InvestmentAgentTests.swift -o /tmp/hako-investment-agent-tests
          /tmp/hako-investment-agent-tests
      - name: Test code workshop request identity and message rendering
        run: |
          swiftc Hako/Features/CodeWorkshop/WorkshopModels.swift Tests/WorkshopModelTests.swift -o /tmp/hako-workshop-tests
          swiftc Hako/Features/CodeWorkshop/WorkshopMessage.swift Tests/WorkshopMessageTests.swift -o /tmp/hako-workshop-message-tests
          /tmp/hako-workshop-message-tests
          /tmp/hako-workshop-tests
          swiftc Hako/Features/CodeWorkshop/WorkshopModels.swift Hako/Features/CodeWorkshop/WorkshopTranscript.swift Tests/WorkshopTranscriptTests.swift -o /tmp/hako-workshop-transcript-tests
          /tmp/hako-workshop-transcript-tests
          swiftc -D AGENT_SOCKET_TESTS Hako/Shared/HakoServer/ServerJSON.swift Hako/Shared/HakoServer/AgentRequestSocket.swift Tests/AgentRequestSocketTests.swift -o /tmp/hako-agent-socket-tests
          /tmp/hako-agent-socket-tests
      - name: Typecheck Console client without signing
        run: |
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/HakoServer/AuthenticatedServerAccess.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 -typecheck Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/HakoServer/ConsoleSecurity.swift Hako/Shared/HakoServer/ConsoleWebLoginProtocol.swift Hako/Shared/HakoServer/ConsoleLoginPromptProtocol.swift Hako/Shared/HakoServer/ConsoleSessionRestoration.swift Hako/Shared/HakoServer/HakoServerCompatibility.swift Hako/Shared/HakoServer/ConsoleClient.swift
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/HakoServer/AuthenticatedServerAccess.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 -typecheck Hako/Shared/Infrastructure/HakoError.swift Hako/Features/CloudServers/ECSModels.swift Hako/Features/CloudServers/ECSAccessModels.swift Hako/Features/CloudServers/ECSAccessStore.swift Hako/Features/CloudServers/ECSAccessRecordsStore.swift Hako/Shared/HakoServer/ConsoleSecurity.swift Hako/Shared/HakoServer/ConsoleWebLoginProtocol.swift Hako/Shared/HakoServer/ConsoleLoginPromptProtocol.swift Hako/Features/DeviceManagement/ConsoleAgentRegistration.swift Hako/Shared/HakoServer/ServerJSON.swift Hako/Features/DeviceManagement/ConsoleAgentProtocol.swift Hako/Shared/HakoServer/ConsoleSessionRestoration.swift Hako/Shared/HakoServer/HakoServerCompatibility.swift Hako/Shared/HakoServer/ConsoleClient.swift Hako/Features/CloudServers/ECSAccessClient.swift Hako/Shared/HakoServer/AgentRequestSocket.swift Hako/Features/DeviceManagement/DeviceMonitorClient.swift Hako/Features/CodeWorkshop/WorkshopModels.swift Hako/Features/CodeWorkshop/WorkshopTranscript.swift Hako/Features/CodeWorkshop/WorkshopStore.swift Hako/Features/CodeWorkshop/WorkshopConversation.swift
          swiftc Hako/Features/CloudServers/ECSModels.swift Hako/Features/CloudServers/ECSAccessModels.swift Tests/ECSAccessTests.swift -o /tmp/hako-ecs-access-tests
          /tmp/hako-ecs-access-tests
          swiftc Hako/Features/CloudServers/ECSAccessModels.swift Hako/Features/CloudServers/ECSAccessRecordsStore.swift Tests/ECSAccessRecordsStoreTests.swift -o /tmp/hako-ecs-records-store-tests
          /tmp/hako-ecs-records-store-tests
          swiftc Hako/Shared/HakoServer/ConsoleSessionRestoration.swift Tests/ConsoleSessionRestorationTests.swift -o /tmp/hako-session-restoration-tests
          /tmp/hako-session-restoration-tests
          swiftc Hako/Shared/HakoServer/ServerJSON.swift Hako/Features/DeviceManagement/ConsoleAgentProtocol.swift Tests/ConsoleAgentProtocolTests.swift -o /tmp/hako-agent-protocol-tests
          /tmp/hako-agent-protocol-tests
          swiftc Hako/Features/DeviceManagement/ConsoleAgentRegistration.swift Tests/ConsoleAgentRegistrationTests.swift -o /tmp/hako-agent-registration-tests
          /tmp/hako-agent-registration-tests
          swiftc Hako/Shared/HakoServer/ConsoleWebLoginProtocol.swift Hako/Shared/HakoServer/ConsoleLoginPromptProtocol.swift Tests/ConsoleWebLoginTests.swift -o /tmp/hako-web-login-tests
          /tmp/hako-web-login-tests
          swiftc Hako/Shared/HakoServer/ConsoleWebLoginProtocol.swift Hako/Shared/HakoServer/ConsoleLoginPromptProtocol.swift Hako/Features/Notifications/HakoNotification.swift Tests/NotificationTests.swift -o /tmp/hako-notification-tests
          /tmp/hako-notification-tests
          swiftc Hako/Shared/HakoServer/ConsoleWebLoginProtocol.swift Hako/Shared/HakoServer/ConsoleLoginPromptProtocol.swift Hako/Features/ServerManagement/ConsoleApplicationProtocol.swift Tests/ConsoleApplicationTests.swift -o /tmp/hako-application-tests
          /tmp/hako-application-tests
          swiftc Hako/Shared/Infrastructure/SecureStorage.swift -target arm64-apple-macos14.0 Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/HakoServer/ConsoleSecurity.swift Tests/ConsoleIdentityTests.swift -o /tmp/hako-identity-tests
          /tmp/hako-identity-tests
      - name: Test host secure storage contract
        run: |
          swiftc -target arm64-apple-macos14.0 Hako/Shared/Infrastructure/SecureStorage.swift Hako/Features/Containers/ArcaneProtocol.swift Hako/Features/Containers/ArcaneWorkspaceProtocol.swift Hako/Features/Containers/ArcaneKeychain.swift Hako/Features/CloudServers/ECSModels.swift Hako/Features/CloudServers/ECSKeychain.swift Tests/CredentialStorageTests.swift -o /tmp/hako-credential-tests
          /tmp/hako-credential-tests
      - name: Test usage storage and GitHub merge
        run: |
          swiftc Hako/Features/Usage/UsagePresentation.swift Tests/UsagePresentationTests.swift -o /tmp/hako-usage-presentation-tests
          /tmp/hako-usage-presentation-tests
          swiftc -target arm64-apple-macos14.0 Hako/Shared/Infrastructure/HakoError.swift Hako/Features/Usage/UsageModels.swift Hako/Shared/Infrastructure/CSV.swift Hako/Features/Usage/UsageCSV.swift Tests/CoreTests.swift -o /tmp/hako-core-tests
          /tmp/hako-core-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Shared/Infrastructure/SecureStorage.swift -target arm64-apple-macos14.0 Hako/Shared/Infrastructure/HakoError.swift Hako/Features/Usage/UsageModels.swift Hako/Shared/Infrastructure/CSV.swift Hako/Features/Usage/UsageCSV.swift Hako/Shared/GitHub/GitHubSettings.swift Hako/Shared/GitHub/GitHubTokenStore.swift Hako/Shared/GitHub/GitHubRepository.swift Hako/Shared/GitHub/GitHubService.swift Hako/Features/Usage/UsageGitHub.swift Hako/Features/Usage/UsageSync.swift Hako/App/Updates/BuildStatus.swift Tests/GitHubTests.swift -o /tmp/hako-github-tests
          /tmp/hako-github-tests
      - name: Test sports records, timestamps and annual GitHub synchronization
        run: |
          swiftc Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/Infrastructure/CSV.swift Hako/Features/Sports/SportsModels.swift Tests/SportsTests.swift -o /tmp/hako-sports-tests
          /tmp/hako-sports-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/Infrastructure/CSV.swift Hako/Features/Sports/SportsModels.swift Hako/Shared/GitHub/GitHubSettings.swift Hako/Shared/GitHub/GitHubRepository.swift Hako/Shared/GitHub/GitHubService.swift Hako/Features/Sports/SportsGitHub.swift Tests/SportsGitHubTests.swift -o /tmp/hako-sports-github-tests
          /tmp/hako-sports-github-tests
          swiftc Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/Infrastructure/CSV.swift Hako/Shared/GitHub/GitHubRepository.swift Hako/Features/Sports/SportsModels.swift Hako/Features/Sports/SportsGitHub.swift Tests/SportsRepositoryTests.swift -o /tmp/hako-sports-repository-tests
          /tmp/hako-sports-repository-tests
      - name: Test device card ordering, layout and scroll restoration
        run: |
          swiftc Hako/Features/DeviceManagement/DeviceCardPresentation.swift Tests/DeviceCardPresentationTests.swift -o /tmp/hako-device-card-tests
          /tmp/hako-device-card-tests
      - name: Test Arcane client protocols and networking
        run: |
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 -typecheck Hako/Features/Containers/ArcaneProtocol.swift Hako/Features/Containers/ArcaneWorkspaceProtocol.swift Hako/Features/Containers/ArcaneHostProtocol.swift Hako/Features/Containers/ArcaneClient.swift Hako/Features/Containers/ArcaneKeychain.swift Hako/Features/Containers/ArcaneStore.swift Hako/Features/Containers/ArcaneFilesStore.swift
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Features/Containers/ArcaneProtocol.swift Hako/Features/Containers/ArcaneWorkspaceProtocol.swift Hako/Features/Containers/ArcaneHostProtocol.swift Hako/Features/Containers/ArcaneClient.swift Tests/ArcaneTests.swift -o /tmp/hako-arcane-tests
          /tmp/hako-arcane-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 Hako/Features/Containers/ArcaneProtocol.swift Hako/Features/Containers/ArcaneWorkspaceProtocol.swift Hako/Features/Containers/ArcaneHostProtocol.swift Hako/Features/Containers/ArcaneClient.swift Hako/Features/Containers/ArcaneKeychain.swift Hako/Features/Containers/ArcaneStore.swift Hako/Features/Containers/ArcaneFilesStore.swift Tests/ArcaneLoadingTests.swift -o /tmp/hako-arcane-loading-tests
          /tmp/hako-arcane-loading-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Features/Containers/ArcaneProtocol.swift Hako/Features/Containers/ArcaneWorkspaceProtocol.swift Hako/Features/Containers/ArcaneHostProtocol.swift Hako/Features/Containers/ArcaneClient.swift Tests/ArcaneWorkspaceTests.swift -o /tmp/hako-arcane-workspace-tests
          /tmp/hako-arcane-workspace-tests
          swiftc Hako/Features/Containers/ArcaneSyntax.swift Tests/ArcaneSyntaxTests.swift -o /tmp/hako-arcane-syntax-tests
          /tmp/hako-arcane-syntax-tests
          swiftc Hako/Features/Containers/ArcaneEditorLines.swift Tests/ArcaneEditorLinesTests.swift -o /tmp/hako-arcane-editor-lines-tests
          /tmp/hako-arcane-editor-lines-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 Hako/Features/Containers/ArcaneProtocol.swift Hako/Features/Containers/ArcaneWorkspaceProtocol.swift Hako/Features/Containers/ArcaneHostProtocol.swift Hako/Features/Containers/ArcaneClient.swift Hako/Features/Containers/ArcaneHostData.swift Tests/ArcaneHostTests.swift -o /tmp/hako-arcane-host-tests
          /tmp/hako-arcane-host-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Features/Containers/ArcaneProtocol.swift Hako/Features/Containers/ArcaneWorkspaceProtocol.swift Hako/Features/Containers/ArcaneHostProtocol.swift Hako/Features/Containers/ArcaneClient.swift Hako/Features/Containers/ArcaneCommandProtocol.swift Hako/Features/Containers/ArcaneTerminalTransport.swift Tests/ArcaneCommandTests.swift -o /tmp/hako-arcane-command-tests
          /tmp/hako-arcane-command-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 Hako/Features/Containers/ArcaneProtocol.swift Hako/Features/Containers/ArcaneWorkspaceProtocol.swift Hako/Features/Containers/ArcaneHostProtocol.swift Hako/Features/Containers/ArcaneClient.swift Hako/Features/Containers/ArcaneKeychain.swift Hako/Features/Containers/ArcaneStore.swift Hako/Features/Containers/ArcaneFilesStore.swift Hako/Features/Containers/ArcaneCommandProtocol.swift Hako/Features/Containers/ArcaneTerminalTransport.swift Hako/Features/Containers/ArcaneCommandsData.swift Tests/ArcaneCommandDataTests.swift -o /tmp/hako-arcane-command-data-tests
          /tmp/hako-arcane-command-data-tests
      - name: Test Headplane sessions, wire protocol and mutation recovery
        run: |
          swiftc -target arm64-apple-macos14.0 Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Features/Headplane/HeadplaneProtocol.swift Hako/Features/Headplane/HeadplaneStream.swift Hako/Features/Headplane/HeadplaneClient.swift Hako/Features/Headplane/HeadplaneStore.swift Tests/HeadplaneTests.swift -o /tmp/hako-headplane-tests
          /tmp/hako-headplane-tests
      - name: Test local application logs and credential redaction
        run: |
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Tests/HakoLogTests.swift -o /tmp/hako-log-tests
          /tmp/hako-log-tests
      - name: Test Qinglong OpenAPI and connection policies
        run: |
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Features/Qinglong/QinglongProtocol.swift Hako/Features/Qinglong/QinglongRefresh.swift Hako/Features/Qinglong/QinglongClient.swift Tests/QinglongTests.swift -o /tmp/hako-qinglong-tests
          /tmp/hako-qinglong-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 -typecheck Hako/Features/Qinglong/QinglongProtocol.swift Hako/Features/Qinglong/QinglongRefresh.swift Hako/Features/Qinglong/QinglongClient.swift Hako/Features/Qinglong/QinglongStore.swift
      - name: Test ECS API signing, snapshots and terminal protocol
        run: |
          swiftc Hako/Features/CloudServers/ECSModels.swift Hako/Features/CloudServers/ECSNetworkModels.swift Tests/ECSNetworkTests.swift -o /tmp/hako-ecs-network-tests
          /tmp/hako-ecs-network-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 -typecheck Hako/Features/CloudServers/ECSModels.swift Hako/Features/CloudServers/ECSRPC.swift Hako/Features/CloudServers/ECSKeychain.swift Hako/Features/CloudServers/ECSStore.swift Hako/Features/CloudServers/ECSTerminalProtocol.swift Hako/Shared/Terminal/HakoTerminalDisplay.swift Hako/Features/CloudServers/ECSTerminalData.swift
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 Hako/Features/CloudServers/ECSModels.swift Hako/Features/CloudServers/ECSRPC.swift Hako/Features/CloudServers/ECSTerminalProtocol.swift Hako/Shared/Terminal/HakoTerminalDisplay.swift Tests/ECSTests.swift -o /tmp/hako-ecs-tests
          /tmp/hako-ecs-tests
          swiftc Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift -target arm64-apple-macos14.0 Hako/Features/CloudServers/ECSModels.swift Hako/Features/CloudServers/ECSRPC.swift Hako/Features/CloudServers/ECSKeychain.swift Hako/Features/CloudServers/ECSStore.swift Tests/ECSLoadingTests.swift -o /tmp/hako-ecs-loading-tests
          /tmp/hako-ecs-loading-tests
      - name: Test private asset records and daily sync policy
        run: |
          swiftc Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/Infrastructure/CSV.swift Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Features/Crypto/CryptoModels.swift Tests/CryptoModelsTests.swift -o /tmp/hako-crypto-model-tests
          /tmp/hako-crypto-model-tests
          swiftc Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/Infrastructure/CSV.swift Hako/Features/Crypto/CryptoModels.swift Hako/Features/Crypto/CryptoChainHoldings.swift Tests/CryptoChainHoldingsTests.swift -o /tmp/hako-crypto-chain-holdings-tests
          /tmp/hako-crypto-chain-holdings-tests
          swiftc Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/Infrastructure/CSV.swift Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Features/Crypto/CryptoModels.swift Hako/Features/Crypto/CryptoCredential.swift Hako/Features/Crypto/CryptoClient.swift Hako/Features/Crypto/CryptoChainClient.swift Tests/CryptoChainTests.swift -o /tmp/hako-crypto-chain-tests
          /tmp/hako-crypto-chain-tests
          swiftc Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/Infrastructure/CSV.swift Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Shared/GitHub/GitHubRepository.swift Hako/Features/Crypto/CryptoModels.swift Hako/Features/Crypto/CryptoChainHoldings.swift Hako/Features/Crypto/CryptoCredential.swift Hako/Features/Crypto/CryptoClient.swift Hako/Features/Crypto/CryptoChainClient.swift Hako/Features/Crypto/CryptoHistory.swift Hako/Features/Crypto/CryptoFundingRates.swift Hako/Features/Crypto/CryptoStore.swift Tests/CryptoStoreTests.swift -o /tmp/hako-crypto-store-tests
          /tmp/hako-crypto-store-tests
          swiftc Hako/Shared/Infrastructure/Logging/HakoLog.swift Hako/Shared/Infrastructure/HakoError.swift Hako/Shared/Infrastructure/CSV.swift Hako/Shared/Infrastructure/HTTPTransport.swift Hako/Shared/Infrastructure/SecureStorage.swift Hako/Features/Crypto/CryptoModels.swift Hako/Features/Crypto/CryptoCredential.swift Hako/Features/Crypto/CryptoClient.swift Hako/Features/Crypto/CryptoFundingRates.swift Hako/Features/Crypto/CryptoHistory.swift Tests/CryptoFundingRatesTests.swift -o /tmp/hako-crypto-funding-tests
          /tmp/hako-crypto-funding-tests
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Archive and export signed IPA
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/ci-archive.sh
      - name: Create installation page
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build-install-page.py --ipa ../../dist/ios/Hako.ipa --url "$PAGES_URL" --output ../../dist/ios/site
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Hako-IPA-${{ github.run_number }}
          path: dist/ios/*.ipa
          retention-days: 14
      - name: Upload installation page
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/ios/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy installation page
        id: deployment
        uses: actions/deploy-pages@v5
