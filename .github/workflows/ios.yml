name: Build and install Hako
on:
  push:
    paths:
      - 'apps/ios/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
      - name: Validate packaging scripts
        run: |
          bash -n scripts/ci-archive.sh
          python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Typecheck Console client without signing
        run: |
          swiftc -target arm64-apple-macos14.0 -typecheck Hako/Models.swift Hako/DeviceManagement/ConsoleSecurity.swift Hako/DeviceManagement/ConsoleWebLoginProtocol.swift Hako/DeviceManagement/ConsoleClient.swift
          swiftc Hako/DeviceManagement/ConsoleWebLoginProtocol.swift Tests/ConsoleWebLoginTests.swift -o /tmp/hako-web-login-tests
          /tmp/hako-web-login-tests
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Archive and export signed IPA
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/ci-archive.sh
      - name: Create installation page
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build-install-page.py --ipa ../../dist/ios/Hako.ipa --url "$PAGES_URL" --output ../../dist/ios/site
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Hako-IPA-${{ github.run_number }}
          path: dist/ios/*.ipa
          retention-days: 14
      - name: Upload installation page
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/ios/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy installation page
        id: deployment
        uses: actions/deploy-pages@v5
