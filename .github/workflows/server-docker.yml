name: Server Docker

on:
  push:
    branches: [master]
    tags: ['**']
    paths: ['apps/server/**', '.github/workflows/server-docker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changes.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to build the server image
        id: changes
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Always publish manual runs and tags, even without server changes.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            echo 'server=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head=$(git rev-parse HEAD)
          empty_tree=$(git hash-object -t tree /dev/null)
          if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base=$empty_tree
          else
            base=$PUSH_BEFORE
            # A force push can leave the previous commit outside the fetched history.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$base"
            fi
          fi

          if git diff --quiet "$base" "$head" -- apps/server/ .github/workflows/server-docker.yml; then
            echo 'server=false' >> "$GITHUB_OUTPUT"
            echo 'No server or workflow changes; skipping image build.'
          else
            status=$?
            if [[ "$status" != 1 ]]; then
              exit "$status"
            fi
            echo 'server=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hako-server
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: apps/server
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-docker
          cache-to: type=gha,mode=max,scope=server-docker
