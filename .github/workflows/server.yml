name: Server
on:
  push:
    paths: ['apps/server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['apps/server/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Coordinate publishing runs from the start while leaving test-only runs independent.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' && !github.event.deleted &&
          (github.ref == 'refs/heads/master' || github.ref_type == 'tag')))
        && format('server-docker-{0}', github.ref)
        || format('server-test-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: go vet ./...
      - run: node --check internal/server/web/app.js
      - run: node --check internal/server/web/access-logs.js
      - run: node --check internal/server/web/applications.js
      - run: node --test tests/*.test.cjs
      - run: go test -race ./...
      - run: bash scripts/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Hako-Server-Linux
          path: dist/server/hako-server-linux-amd64
      - run: docker build -t hako-server:test .
      - name: Verify Compose configuration and non-root database access
        run: |
          mkdir -p data config
          docker run --rm --user 0 \
            -v "$PWD/data:/app/data" \
            -v "$PWD/config:/app/config" \
            --entrypoint sh hako-server:test \
            -c 'hako-server init && chown 10001:10001 /app/data /app/config /app/config/server.json && chmod 700 /app/data /app/config'
          HAKO_PUBLIC_URL=https://monitor.example.com docker compose config --quiet
          docker run --rm \
            -v "$PWD/data:/app/data" \
            -v "$PWD/config:/app/config:ro" \
            hako-server:test revoke-consoles

  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !github.event.deleted &&
       (github.ref == 'refs/heads/master' || github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changes.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to build the server image
        id: changes
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Always publish manual runs and tags, even without server changes.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" ]]; then
            echo 'server=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head=$(git rev-parse HEAD)
          empty_tree=$(git hash-object -t tree /dev/null)
          if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base=$empty_tree
          else
            base=$PUSH_BEFORE
            # A force push can leave the previous commit outside the fetched history.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$base"
            fi
          fi

          if git diff --quiet "$base" "$head" -- apps/server/ .github/workflows/server.yml; then
            echo 'server=false' >> "$GITHUB_OUTPUT"
            echo 'No server or workflow changes; skipping image build.'
          else
            status=$?
            if [[ "$status" != 1 ]]; then
              exit "$status"
            fi
            echo 'server=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hako-server
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: apps/server
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-docker
          cache-to: type=gha,mode=max,scope=server-docker
