name: Server
on:
  push:
    paths: ['apps/server/**']
  pull_request:
    paths: ['apps/server/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: go vet ./...
      - run: node --check internal/server/web/app.js
      - run: node --check internal/server/web/access-logs.js
      - run: go test -race ./...
      - run: bash scripts/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Hako-Server-Linux
          path: dist/server/hako-server-linux-amd64
      - run: docker build -t hako-server:test .
      - name: Verify Compose configuration and non-root database access
        run: |
          mkdir -p data config
          docker run --rm --user 0 \
            -v "$PWD/data:/app/data" \
            -v "$PWD/config:/app/config" \
            --entrypoint sh hako-server:test \
            -c 'hako-server init && chown 10001:10001 /app/data /app/config /app/config/server.json && chmod 700 /app/data /app/config'
          HAKO_PUBLIC_URL=https://monitor.example.com docker compose config --quiet
          docker run --rm \
            -v "$PWD/data:/app/data" \
            -v "$PWD/config:/app/config:ro" \
            hako-server:test revoke-consoles
