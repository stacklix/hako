name: Server
on:
  push:
    paths: ['apps/server/**']
  pull_request:
    paths: ['apps/server/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: go vet ./...
      - run: node --check internal/server/web/app.js
      - run: go test -race ./...
      - run: bash scripts/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Hako-Server-Linux
          path: dist/server/hako-server-linux-amd64
      - run: docker build -t hako-server:test .
      - name: Check Compose configuration
        run: |
          mkdir -p secrets config
          printf 'test-only-not-a-production-key' > secrets/master.key
          printf '{"username":"owner","agents":[],"consoles":[]}' > config/server.json
          HAKO_PUBLIC_URL=https://monitor.example.com docker compose config --quiet
