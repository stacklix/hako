name: Windows
on:
  push:
    paths: ['apps/windows/**', 'apps/server/internal/server/windows_test.go', '.github/workflows/windows.yml']
  pull_request:
    paths: ['apps/windows/**', 'apps/server/internal/server/windows_test.go', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Hako/Hako.csproj -c Release
      - run: dotnet run --project tests/Hako.Checks/Hako.Checks.csproj -c Release
      - run: dotnet run --project tests/Hako.Checks/Hako.Checks.csproj -c Release -- code-workshop
      - run: dotnet run --project tests/Hako.Checks/Hako.Checks.csproj -c Release -- agent-direct
      - run: dotnet run --project tests/Hako.Checks/Hako.Checks.csproj -c Release -- binary-uploads
      - run: dotnet run --project tests/Hako.Checks/Hako.Checks.csproj -c Release -- command-tasks
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Verify real Windows agent interoperability
        working-directory: apps/server
        shell: pwsh
        run: |
          $env:HAKO_WINDOWS_CHECKS = Join-Path $env:GITHUB_WORKSPACE 'apps/windows/tests/Hako.Checks/bin/Release/net10.0-windows/Hako.Checks.exe'
          go test ./internal/server -run TestWindowsAgentEndToEnd -v
      - run: ./scripts/publish.ps1
      - name: Verify published CLI and help
        run: ./tests/cli-smoke.ps1 -Executable ../../dist/windows/Hako.exe
      - name: Verify startup under a restrictive Windows job
        run: ./tests/cli-smoke.ps1 -Executable ../../dist/windows/Hako.exe -RestrictBackgroundLaunch
      - name: Verify guardian update and recovery
        run: dotnet run --project tests/Hako.Checks/Hako.Checks.csproj -c Release -- guardian ../../dist/windows/Hako.exe
      - name: Verify guardian image refresh
        run: dotnet run --project tests/Hako.Checks/Hako.Checks.csproj -c Release -- guardian-refresh ../../dist/windows/Hako.exe
      - name: Verify commands survive main and guardian replacement
        shell: pwsh
        run: |
          $project = Join-Path $env:USERPROFILE ('Code/hako-command-fixture-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path (Join-Path $project '.git') -Force | Out-Null
          try {
            dotnet run --project tests/Hako.Checks/Hako.Checks.csproj -c Release -- command-host ../../dist/windows/Hako.exe $project
            if ($LASTEXITCODE -ne 0) { throw 'Command guardian checks failed.' }
          } finally {
            $resolved = [IO.Path]::GetFullPath($project)
            $prefix = [IO.Path]::GetFullPath((Join-Path $env:USERPROFILE 'Code/hako-command-fixture-'))
            if (!$resolved.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe fixture cleanup path.' }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Hako-Windows
          path: dist/windows/Hako.exe
  release:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download verified Agent artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name Hako-Windows --dir dist/windows
      - name: Publish immutable Agent release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./apps/windows/scripts/publish-github-release.ps1 -Executable dist/windows/Hako.exe -Repository ${{ github.repository }} -Commit ${{ github.sha }} -BuildId ${{ github.run_id }} -Attempt ${{ github.run_attempt }}
