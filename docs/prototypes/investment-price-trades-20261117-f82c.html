  <script>
    (() => {
      const root = document.getElementById('hako-price-f82c');
      const $ = s => root.querySelector(s);
      const phone = $('.phone'), chart = $('[data-chart]'), plot = $('[data-plot]');
      const DAY = 86400000, end = Date.UTC(2026,10,17), first = Date.UTC(2021,10,17);
      const instruments = {
        etf: {name:'沪深300ETF',code:'510300.SH',kind:'ETF',logo:'300',account:'银河证券',unit:'份',precision:3,last:4.48,scale:1},
        fund: {name:'示例成长混合',code:'000001.OF',kind:'基金',logo:'基',account:'基金理财账户',unit:'份',precision:4,last:2.6384,scale:1.4},
        stock: {name:'示例科技',code:'600000.SH',kind:'股票',logo:'股',account:'银河证券',unit:'股',precision:2,last:38.56,scale:.1}
      };
      const sourceTrades = [
        {date:'2022-03-18',side:'buy',quantity:3000},
        {date:'2024-02-06',side:'buy',quantity:2000},
        {date:'2025-11-20',side:'sell',quantity:1000},
        {date:'2026-09-04',side:'buy',quantity:1500},
        {date:'2026-09-28',side:'sell',quantity:500},
        {date:'2026-10-16',side:'buy',quantity:1000},
        {date:'2026-11-04',side:'buy',quantity:600},
        {date:'2026-11-12',side:'sell',quantity:600}
      ].map((t,i) => ({...t,id:i,time:Date.parse(t.date+'T00:00:00Z')}));
      const state = {asset:'etf',tab:'price',range:'3m',trade:null,day:null,group:null};
      let points=[], trades=[], geometry=null;
      const formatDate = time => new Date(time).toISOString().slice(0,10);
      const number = (value,digits=2) => value.toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits});
      const money = value => '¥'+number(value,2);
      const item = () => instruments[state.asset];
      function dailyPrice(time) {
        const t = (time-first)/DAY, total = (end-first)/DAY;
        const base = x => 0.68 + x/total*.32 + Math.sin(x/48)*.055 + Math.sin(x/11)*.017 + Math.cos(x/3.8)*.008;
        return Number((item().last*base(t)/base(total)).toFixed(item().precision));
      }
      function startDate() {
        if(state.range==='all') return sourceTrades[0].time;
        const d = new Date(end);
        if(state.range.endsWith('m')) d.setUTCMonth(d.getUTCMonth()-parseInt(state.range));
        else d.setUTCFullYear(d.getUTCFullYear()-parseInt(state.range));
        return Math.max(first,d.getTime());
      }
      function holdings(time) {
        let quantity=0,net=0;
        for(const t of sourceTrades) if(t.time<=time) {
          const q=t.quantity*item().scale,sign=t.side==='buy'?1:-1;
          quantity+=q*sign; net+=q*dailyPrice(t.time)*sign;
        }
        return item().kind==='基金'?net:quantity;
      }
      function saveState() {
        if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{example:state.asset,chart:state.tab,range:state.range},privateContent:{...state}}).catch(()=>{});
      }
      function rebuildData() {
        const start=startDate();points=[];
        for(let day=start;day<=end;day+=DAY) {
          const weekday=new Date(day).getUTCDay();
          if(weekday!==0&&weekday!==6) points.push({time:day,price:dailyPrice(day),value:state.tab==='price'?dailyPrice(day):holdings(day)});
        }
        trades=sourceTrades.filter(t=>t.time>=start&&t.time<=end).map(t=>({...t,quantity:t.quantity*item().scale,price:dailyPrice(t.time)}));
      }
      function paintChart() {
        const width=Math.max(240,plot.clientWidth),height=231;
        chart.setAttribute('viewBox',`0 0 ${width} ${height}`);
        const pad={left:3,right:43,top:23,bottom:29};
        const x=t=>pad.left+(t-startDate())/(end-startDate())*(width-pad.left-pad.right);
        const rawMin=Math.min(...points.map(p=>p.value)),rawMax=Math.max(...points.map(p=>p.value));
        const delta=Math.max(rawMax-rawMin,rawMax*.025,1e-5),lo=Math.max(0,rawMin-delta*.2),hi=rawMax+delta*.2;
        const y=v=>pad.top+(hi-v)/(hi-lo)*(height-pad.top-pad.bottom);
        geometry={x,y,width,height};
        const levels=Array.from({length:4},(_,i)=>lo+(hi-lo)*i/3);
        const compact=v=>state.tab==='price'?number(v,item().precision):v>=10000?(v/10000).toFixed(1)+'万':number(v,0);
        const grid=levels.map(v=>`<line class="grid" x1="${pad.left}" x2="${width-pad.right}" y1="${y(v)}" y2="${y(v)}"/><text x="${width-1}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`).join('');
        const tickDates=[startDate(),Math.round((startDate()+end)/2/DAY)*DAY,end];
        const tickLabel=t=>state.range==='5y'||state.range==='2y'||state.range==='all'?formatDate(t).slice(0,7):formatDate(t).slice(5);
        const ticks=tickDates.map((t,i)=>`<text x="${x(t)}" y="${height-5}" text-anchor="${i===0?'start':i===2?'end':'middle'}">${tickLabel(t)}</text>`).join('');
        let path='';
        points.forEach((p,i)=>{const px=x(p.time),py=y(p.value);if(i===0)path+=`M${px},${py}`;else path+=state.tab==='holding'?`H${px}V${py}`:`L${px},${py}`;});
        chart.innerHTML=`<title>${item().name} ${state.tab==='price'?'日线价格':'持仓变化'}，${formatDate(startDate())}至${formatDate(end)}</title>${grid}<path class="trend" d="${path}"/>${ticks}<g data-selection></g>`;
        const markerRoot=$('[data-markers]');markerRoot.replaceChildren();
        const clusters=[];
        if(state.tab==='price') for(const trade of trades) {
          const group=clusters[clusters.length-1];
          if(group&&x(trade.time)-x(group[group.length-1].time)<43) group.push(trade); else clusters.push([trade]);
        }
        for(const group of clusters) {
          const trade=group[group.length-1],multiple=group.length>1;
          const button=document.createElement('button');button.type='button';button.className='trade-pin cursor-interaction'+(multiple?' cluster':trade.side==='sell'?' sell':'');
          button.textContent=multiple?group.length+'笔':trade.side==='buy'?'买':'卖';
          button.style.left=x(trade.time)+'px';button.style.top=y(trade.price)+'px';
          button.setAttribute('aria-label',multiple?`${group[0].date} 至 ${trade.date}，${group.length} 笔买卖，点击展开`:`${trade.date} ${trade.side==='buy'?'买入':'卖出'} ${number(trade.quantity,0)}${item().unit}，成交价 ${number(trade.price,item().precision)} CNY`);
          if(!multiple) button.dataset.trade=trade.id;
          else button.dataset.cluster=group.map(t=>t.id).join(',');
          button.setAttribute('aria-pressed',String(!multiple&&state.trade===trade.id));
          button.addEventListener('click',()=>{state.trade=multiple?null:state.trade===trade.id?null:trade.id;state.group=multiple?group.map(t=>t.id):null;state.day=null;updateDetail();saveState();});markerRoot.append(button);
        }
        updateDetail();
      }
      function renderRecords() {
        const records=$('[data-records]');records.replaceChildren();
        for(const trade of sourceTrades.slice(-2).reverse()) {
          const buy=trade.side==='buy',button=document.createElement('button');button.type='button';button.className='record cursor-interaction';
          button.innerHTML=`<span class="record-icon${buy?'':' sell'}">${buy?'买':'卖'}</span><span class="record-text"><span>${buy?'买入':'卖出'}</span><span class="sub" style="display:block">${trade.date}</span></span><span class="record-price">${number(trade.quantity*item().scale,0)} ${item().unit}<span class="sub" style="display:block">成交价 ${number(dailyPrice(trade.time),item().precision)}</span></span>`;
          button.addEventListener('click',()=>{state.tab='price';if(trade.time<startDate())state.range='all';state.trade=trade.id;state.group=null;state.day=null;render();saveState();});records.append(button);
        }
      }
      function updateDetail() {
        const active=state.tab==='price'?trades.find(t=>t.id===state.trade):null;
        const selected=active?{time:active.time,value:active.price}:state.day!==null?points.reduce((a,b)=>Math.abs(a.time-state.day)<Math.abs(b.time-state.day)?a:b):null;
        const last=points[points.length-1],p=selected||last,isPrice=state.tab==='price';
        $('[data-readout-label]').textContent=formatDate(p.time)+' · '+(active?'成交价':isPrice?(item().kind==='基金'?'单位净值':'收盘价'):'日终'+(item().kind==='基金'?'净投入':'持仓'));
        $('[data-price]').textContent=number(p.value,isPrice?item().precision:item().kind==='基金'?2:0);
        $('[data-unit]').textContent=isPrice?'CNY / '+item().unit:item().kind==='基金'?'CNY':item().unit;
        const change=(last.price/points[0].price-1)*100;
        $('[data-change]').textContent=(change>=0?'+':'')+change.toFixed(2)+'%';$('[data-change]').classList.toggle('negative',change<0);
        $('[data-change-wrap]').hidden=!isPrice;
        const detail=$('[data-detail]');
        const group=Array.isArray(state.group)?trades.filter(t=>state.group.includes(t.id)):[];
        if(group.length>1&&isPrice) {
          detail.innerHTML=`<div class="detail-top"><span>密集交易 · ${group.length} 笔</span><button type="button" class="detail-close cursor-interaction" aria-label="收起密集交易" data-clear>×</button></div><div class="group-trades">${group.map(t=>`<button type="button" data-group-trade="${t.id}" class="cursor-interaction"><span><span class="trade-badge${t.side==='sell'?' sell':''}">${t.side==='buy'?'买入':'卖出'}</span> ${t.date}</span><span>${number(t.price,item().precision)} · ${number(t.quantity,0)} ${item().unit}</span></button>`).join('')}</div>`;
          $('[data-clear]').addEventListener('click',()=>{state.group=null;updateDetail();saveState();});
          detail.querySelectorAll('[data-group-trade]').forEach(button=>button.addEventListener('click',()=>{state.trade=Number(button.dataset.groupTrade);state.group=null;updateDetail();saveState();}));
        } else if(active) {
          detail.innerHTML=`<div class="detail-top"><span class="detail-title"><span class="trade-badge${active.side==='sell'?' sell':''}">${active.side==='buy'?'买入':'卖出'}</span>${active.date}</span><button type="button" class="detail-close cursor-interaction" aria-label="收起成交详情" data-clear>×</button></div><div class="detail-values"><span>成交价 ${number(active.price,item().precision)}</span><span>${number(active.quantity,0)} ${item().unit} · ${money(active.quantity*active.price)}</span></div><p class="hint">${active.time===sourceTrades[0].time?'首次建仓 · ':''}标记对应此账户的实际成交流水</p>`;
          $('[data-clear]').addEventListener('click',()=>{state.trade=null;updateDetail();saveState();});
        } else if(selected) {
          detail.innerHTML=`<div class="detail-top"><span>${formatDate(p.time)}</span><span class="sub">${isPrice?'历史行情':'历史持仓'}</span></div><p class="hint">${isPrice?'点按曲线选择日期，拖动继续查看每日价格。':item().kind==='基金'?'净投入按买入金额减去卖出回款计算。':'按每日持仓数量显示，包含买卖与数量调整。'}</p>`;
        } else {
          detail.innerHTML=`<div class="detail-top"><span>${formatDate(startDate())} — ${formatDate(end)}</span><span class="sub">${isPrice?trades.length+' 笔交易':item().kind==='基金'?'净投入 · CNY':'持仓 · '+item().unit}</span></div><p class="hint">${isPrice?'点按买卖标记查看成交，拖动曲线查看每日价格。':item().kind==='基金'?'净投入按买入金额减去卖出回款计算，不随报价变化。':'按每日持仓数量显示，包含买卖与数量调整。'}</p>`;
        }
        const selection=chart.querySelector('[data-selection]');
        selection.innerHTML=selected?`<line class="selected-line" x1="${geometry.x(p.time)}" x2="${geometry.x(p.time)}" y1="14" y2="202"/><circle class="selected-dot" cx="${geometry.x(p.time)}" cy="${geometry.y(p.value)}" r="4"/>`:'';
        root.querySelectorAll('[data-trade]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.trade)===state.trade)));
      }
      function render() {
        const i=item();$('[data-name]').textContent=i.name;$('[data-code]').textContent=i.code+' · '+i.kind+' · '+i.account;$('[data-logo]').textContent=i.logo;
        $('[data-market-value]').textContent=money(6000*i.scale*i.last);$('[data-quantity]').textContent=number(6000*i.scale,2)+' '+i.unit;
        $('[data-quantity-label]').textContent=i.kind==='股票'?'持有数量':'持有份额';
        const holdingTab=$('[data-tab="holding"]');holdingTab.textContent=i.kind==='基金'?'净投入变化':'持仓数量';
        root.querySelectorAll('[data-tab]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===state.tab)));
        $('#hp-chart-f82c').setAttribute('aria-labelledby',state.tab==='price'?'hp-price-tab-f82c':'hp-holding-tab-f82c');
        root.querySelectorAll('[data-range]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.range===state.range)));
        $('[data-legend]').hidden=state.tab!=='price';
        $('[data-interval]').textContent=formatDate(startDate())+' — '+formatDate(end).slice(5);
        $('[data-footnote]').textContent=state.tab==='price'?(i.kind==='基金'?'基金按每日单位净值绘制，买卖点按实际成交净值标注。':'日线按收盘价绘制，买卖点按实际成交价标注。'):'持仓图沿用原有口径，与市场价格走势分开查看。';
        rebuildData();paintChart();renderRecords();
      }
      root.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{state.tab=button.dataset.tab;state.trade=null;state.group=null;state.day=null;render();saveState();}));
      root.querySelectorAll('[data-range]').forEach(button=>button.addEventListener('click',()=>{state.range=button.dataset.range;state.trade=null;state.group=null;state.day=null;render();saveState();}));
      $('#hp-example-f82c').addEventListener('change',event=>{state.asset=event.target.value;state.trade=null;state.group=null;state.day=null;render();saveState();});
      let dragging=false,moved=false;
      function selectDay(event) {const bounds=chart.getBoundingClientRect(),x=Math.max(0,Math.min(bounds.width,event.clientX-bounds.left));state.trade=null;state.group=null;state.day=startDate()+Math.max(0,Math.min(1,(x-3)/(geometry.width-46)))*(end-startDate());updateDetail();}
      chart.addEventListener('pointerdown',event=>{dragging=true;moved=false;chart.setPointerCapture(event.pointerId);selectDay(event);});
      chart.addEventListener('pointermove',event=>{if(dragging){moved=true;selectDay(event);}});
      chart.addEventListener('pointerup',()=>{dragging=false;saveState();});chart.addEventListener('pointercancel',()=>{dragging=false;});
      root.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{$('[data-footnote]').textContent=button.dataset.action==='back'?'当前为标的详情原型，可继续切换走势图与时间范围。':'当前为交互原型，未修改真实标的或交易。';}));
      function restore(saved) {const s=saved?.privateContent;if(!s)return;if(instruments[s.asset])state.asset=s.asset;if(['price','holding'].includes(s.tab))state.tab=s.tab;if(['all','1m','3m','6m','1y','2y','5y'].includes(s.range))state.range=s.range;state.trade=Number.isInteger(s.trade)?s.trade:null;state.day=Number.isFinite(s.day)?s.day:null;$('#hp-example-f82c').value=state.asset;render();}
      render();restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
      const observer=new ResizeObserver(()=>paintChart());observer.observe(plot);
      const design={theme:'dark'};
      if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{phone.style.colorScheme=design.theme;}});tweak.addSelect(design,'theme',{label:'外观',options:[{label:'深色',value:'dark'},{label:'浅色',value:'light'}]});}
    })();
  </script>
</div>
