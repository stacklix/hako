  <script>
  (() => {
    const root = document.getElementById('hako-overview-a9d37f');
    const app = root.querySelector('.app');
    const svg = root.querySelector('.history-chart');
    const plot = root.querySelector('.plot');
    const slider = root.querySelector('.scrub');
    const end = Date.UTC(2026,10,18), day = 86400000;
    const first = Date.UTC(2021,10,18), count = Math.round((end-first)/day);
    const money = value => Math.abs(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const dates = new Intl.DateTimeFormat('sv-SE',{timeZone:'UTC',year:'numeric',month:'2-digit',day:'2-digit'});
    const accounts=[{name:'证券账户',share:.55,gainShare:64520/84520},{name:'基金理财',share:.3,gainShare:24000/84520},{name:'加密货币',share:.15,gainShare:-4000/84520}];
    const points = Array.from({length:count+1},(_,i) => {
      const t=i/count, date=first+i*day;
      let gain = -6500+86500*t+7000*Math.sin(i*.025)+2700*Math.sin(i*.11);
      gain += (84520-(-6500+86500+7000*Math.sin(count*.025)+2700*Math.sin(count*.11)))*t;
      if(i===count-1) gain=82659.65;
      if(i===count) gain=84520;
      const net = date>=Date.UTC(2026,10,8)?400000:date>=Date.UTC(2025,10,18)?350000:date>=Date.UTC(2024,10,18)?280000:date>=Date.UTC(2023,10,18)?220000:date>=Date.UTC(2022,10,18)?160000:100000;
      return {date,gain,rate:gain/net,value:net+gain,accounts:accounts.map(account=>{const investment=net*account.share,profit=gain*account.gainShare;return {name:account.name,value:investment+profit,gain:profit,rate:profit/investment}})};
    });
    let metric='value', months=1, selected=end, visible=[], geometry=null, previous=null, frame=0;
    const saved=window.openai?.widgetState?.privateContent;
    function restore(state) {
      if(!state) return;
      if(['value','gain','rate'].includes(state.metric)) metric=state.metric;
      if([0,1,3,12,24,60].includes(state.months)) months=state.months;
      if(Number.isFinite(state.selected)) selected=Math.min(end,Math.max(first,state.selected));
    }
    restore(saved);
    function save() {
      window.openai?.setWidgetState?.({modelContent:{curve:metric,months},privateContent:{metric,months,selected}})?.catch(()=>{});
    }
    function reading() {
      const p=visible.reduce((best,p)=>Math.abs(p.date-selected)<Math.abs(best.date-selected)?p:best,visible[0]);
      selected=p.date;
      root.querySelector('.date').textContent=dates.format(new Date(p.date))+(p.date===end?' · 暂估':'');
      const label=root.querySelector('.read-value');
      label.textContent=metric==='rate'?(p.rate>0?'+':'')+(p.rate*100).toFixed(2)+'%':(metric==='gain'?(p.gain>0?'+':p.gain<0?'−':''):'')+money(p[metric]);
      label.className='read-value nums'+(metric==='value'?'':p[metric]<0?' loss':' gain');
      slider.value=String(visible.indexOf(p));
      root.querySelector('.account-details-title').textContent={value:'各账户总额 · CNY',gain:'各账户盈亏 · CNY',rate:'各账户盈亏率'}[metric];
      root.querySelector('.account-values').innerHTML=p.accounts.map(account=>{
        const value=account[metric];
        const color=metric==='value'?'':value>0?' gain':value<0?' loss':' muted';
        const formatted=metric==='rate'?(value>0?'+':'')+(value*100).toFixed(2)+'%':(metric==='gain'?(value>0?'+':value<0?'−':''):'')+money(value);
        return `<div class="account"><span class="account-name">${account.name}</span><span class="account-right nums${color}">${formatted}</span></div>`;
      }).join('');
      if(geometry) {
        const {left,right,top,bottom,width,x,y}=geometry;
        const sx=x(p.date), sy=y(p[metric]);
        svg.querySelector('.selection').innerHTML=`<line class="guide" x1="${sx}" y1="${top}" x2="${sx}" y2="${bottom}"/><circle class="point" cx="${sx}" cy="${sy}" r="4.5"/>`;
      }
    }
    function render(animate=false) {
      const start=new Date(end);
      if(months===0) start.setUTCMonth(0,1);
      else start.setUTCMonth(start.getUTCMonth()-months);
      visible=points.filter(p=>p.date>=+start);
      selected=Math.max(visible[0].date,Math.min(end,selected));
      slider.max=String(visible.length-1);
      root.querySelectorAll('[data-metric]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.metric===metric)));
      root.querySelectorAll('[data-months]').forEach(b=>b.setAttribute('aria-checked',String(Number(b.dataset.months)===months)));
      root.querySelector('.range-label').textContent={0:'今年',1:'近一月',3:'近三月',12:'近一年',24:'近两年',60:'近五年'}[months];
      root.querySelector('[role="tabpanel"]').setAttribute('aria-labelledby','ho-a9d37f-'+metric);
      root.querySelector('.explanation').textContent=metric==='value'?'按人民币汇总投资总额，历史使用日终估值。':metric==='gain'?'累计盈亏，切换时间范围不归零；缺少完整估值时不连线。':'盈亏率 = 累计盈亏 ÷ 净投入，非年化。净投入不大于零时不显示。';
      const width=Math.max(240,plot.clientWidth), height=171, left=49,right=width-5,top=10,bottom=142;
      let low=Math.min(...visible.map(p=>p[metric])),high=Math.max(...visible.map(p=>p[metric]));
      low=Math.min(low,0);high=Math.max(high,0);
      const pad=Math.max((high-low)*.1,metric==='rate'?.005:100);low-=pad;high+=pad;
      const x=date=>left+(date-visible[0].date)/(end-visible[0].date)*(right-left);
      const y=value=>bottom-(value-low)/(high-low)*(bottom-top);
      geometry={left,right,top,bottom,width,x,y};
      const tick = v => metric==='rate'?(v*100).toFixed(1)+'%':Math.abs(v)>=10000?(v/10000).toFixed(1)+'万':Math.round(v).toLocaleString('en-US');
      const grid=Array.from({length:4},(_,i)=>{const value=low+(high-low)*i/3,yy=y(value);return `<line class="grid" x1="${left}" y1="${yy}" x2="${right}" y2="${yy}"/><text x="${left-7}" y="${yy+4}" text-anchor="end">${tick(value)}</text>`}).join('');
      const axis=[0,.5,1].map((t,i)=>{const date=new Date(visible[0].date+(end-visible[0].date)*t);const label=months>12?date.getUTCFullYear()+'/'+String(date.getUTCMonth()+1).padStart(2,'0'):String(date.getUTCMonth()+1).padStart(2,'0')+'/'+String(date.getUTCDate()).padStart(2,'0');return `<text x="${left+(right-left)*t}" y="${height-8}" text-anchor="${i===0?'start':i===2?'end':'middle'}">${label}</text>`}).join('');
      const sampled=Array.from({length:100},(_,i)=>visible[Math.round(i/99*(visible.length-1))]);
      const coords=sampled.map(p=>[x(p.date),y(p[metric])]);
      const path=values=>values.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
      const area=values=>path(values)+` L${right},${y(0)} L${left},${y(0)} Z`;
      cancelAnimationFrame(frame);
      svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      const name={value:'投资总额，单位人民币',gain:'累计盈亏，单位人民币',rate:'盈亏率，单位百分比'}[metric];
      svg.setAttribute('aria-label',name+'，'+dates.format(new Date(visible[0].date))+'至2026-11-18，示例数据');
      svg.innerHTML=`<title>${name}</title>${grid}<path class="area" d="${area(coords)}"/><line class="zero" x1="${left}" y1="${y(0)}" x2="${right}" y2="${y(0)}"/><path class="curve" d="${path(coords)}"/>${axis}<g class="selection"></g>`;
      if(animate&&previous&&!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const old=previous, line=svg.querySelector('.curve'),fill=svg.querySelector('.area'),time=performance.now();
        const step=now=>{const progress=Math.min(1,(now-time)/240),t=1-Math.pow(1-progress,3),values=coords.map((p,i)=>[old[i][0]+(p[0]-old[i][0])*t,old[i][1]+(p[1]-old[i][1])*t]);line.setAttribute('d',path(values));fill.setAttribute('d',area(values));if(progress<1)frame=requestAnimationFrame(step)};
        frame=requestAnimationFrame(step);
      }
      previous=coords;reading();
    }
    root.querySelectorAll('[data-metric]').forEach(button=>button.addEventListener('click',()=>{metric=button.dataset.metric;render(true);save()}));
    root.querySelectorAll('[data-months]').forEach(button=>button.addEventListener('click',()=>{months=Number(button.dataset.months);selected=end;setMenu(false);render(true);save();root.querySelector('.range-trigger').focus()}));
    function setMenu(open) {root.querySelector('.range-menu').hidden=!open;root.querySelector('.range-trigger').setAttribute('aria-expanded',String(open))}
    root.querySelector('.range-trigger').addEventListener('click',()=>setMenu(root.querySelector('.range-menu').hidden));
    document.addEventListener('pointerdown',event=>{if(!root.querySelector('.range-control').contains(event.target))setMenu(false)});
    root.addEventListener('keydown',event=>{if(event.key==='Escape'){setMenu(false);root.querySelector('.range-trigger').focus()}});
    root.querySelector('.range-control').addEventListener('keydown',event=>{
      if(!['ArrowDown','ArrowUp'].includes(event.key))return;
      event.preventDefault();setMenu(true);const options=[...root.querySelectorAll('[data-months]')],index=options.indexOf(document.activeElement);
      options[index<0?0:(index+(event.key==='ArrowDown'?1:options.length-1))%options.length].focus();
    });
    root.querySelector('.tabs').addEventListener('keydown',event=>{
      if(!['ArrowLeft','ArrowRight'].includes(event.key))return;
      event.preventDefault();const tabs=[...root.querySelectorAll('[data-metric]')],index=tabs.findIndex(b=>b.dataset.metric===metric);
      const next=tabs[(index+(event.key==='ArrowRight'?1:2))%3];next.click();next.focus();
    });
    slider.addEventListener('input',()=>{selected=visible[Number(slider.value)].date;reading()});
    slider.addEventListener('change',save);
    svg.addEventListener('pointerdown',event=>{svg.setPointerCapture(event.pointerId);pick(event)});
    svg.addEventListener('pointermove',event=>{if(event.buttons)pick(event)});
    svg.addEventListener('pointerup',save);
    function pick(event) {const rect=svg.getBoundingClientRect(),{left,right}=geometry;const t=Math.max(0,Math.min(1,(event.clientX-rect.left-left)/(right-left)));selected=visible[Math.round(t*(visible.length-1))].date;reading()}
    const gains=[420,-180,360,780,540,280,-330,620,850,-120,460,1100,380,760,-240,640,920,1860.35];
    root.querySelector('.days').innerHTML=Array.from({length:6},()=>'<span class="day empty"></span>').join('')+Array.from({length:30},(_,i)=>{const d=i+1,g=gains[i];return `<div class="day ${d>18?'future':g<0?'negative':'positive'} ${d===18?'today':''}" aria-label="11月${d}日${d<=18?'，盈亏'+g.toFixed(2):''}"><span>${d}</span>${d<=18?`<small class="nums">${g>0?'+':''}${g===1860.35?'1.86k':g}</small>`:''}</div>`}).join('');
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState.privateContent);render()}});
    new ResizeObserver(()=>render()).observe(plot);
    render();
  })();
  </script>
</div>
